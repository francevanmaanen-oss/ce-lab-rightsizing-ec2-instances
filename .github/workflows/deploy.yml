name: Deploy Lab Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - 'user-data.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Upload Terraform state
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: |
            terraform.tfstate
            terraform.tfstate.backup
          retention-days: 90
          if-no-files-found: error

      - name: Show Outputs
        run: |
          echo "## Lab Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Instance IDs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output -json instance_ids >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Wait 3-4 minutes for instances to boot and the CloudWatch agent to start" >> $GITHUB_STEP_SUMMARY
          echo "2. Run the stress test on the web-server instance ID shown above" >> $GITHUB_STEP_SUMMARY
          echo "3. Wait 10-15 minutes for CloudWatch metrics to populate" >> $GITHUB_STEP_SUMMARY
          echo "4. Query metrics and build the rightsizing report" >> $GITHUB_STEP_SUMMARY
          echo "5. Push to the \`destroy\` branch when done to tear down all resources" >> $GITHUB_STEP_SUMMARY
